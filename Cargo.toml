[workspace]
resolver = "3"
members = [
    # Host tools: the build orchestrator and the conformance harness.
    "tools/build",
    "tools/conformance",
    # Licensed Internal Code: PID 1, release identity, reference codes.
    "lic/qsmcinit",
    "lic/release",
    "lic/refcode",
    # The services: the base crates' own, run as QS/MC.
    "lic/qsmcstgd",
    "lic/qsmclogd",
    "lic/qsmcnetd",
    # The test hooks: in a test image only, never in a release.
    "lic/qsmchook",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# The two pins (docs/PHASE0.md). QS/VS's base crates at one commit of
# its main; QS/400's crates at exactly the commit that QS/VS commit
# pins, so the tree holds one copy of every shared crate. Moving either
# is its own commit, and they move together. Never path dependencies,
# never copies.
appliance = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
supervise = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
loadsource = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
state = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
logd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
netd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
seed = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
identity = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
stgd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "9f11fd5660556dabf789a062768418adf0548583" }
buildkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
vrm = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
diskimg = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
abrec = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
ipc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
ntp = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.190"
rustix = { version = "1.1.6", features = ["fs", "mount", "event", "process", "system", "time", "termios"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.28.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The image's binaries: the userland check wants them static and
# stripped.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
