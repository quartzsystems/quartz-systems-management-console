[workspace]
resolver = "3"
members = [
    # Host tools: the build orchestrator and the conformance harness.
    "tools/build",
    "tools/conformance",
    # Licensed Internal Code: PID 1, release identity, reference codes.
    "lic/qsmcinit",
    "lic/release",
    "lic/refcode",
    # The services: the base crates' own, run as QS/MC.
    "lic/qsmcstgd",
    "lic/qsmclogd",
    "lic/qsmcnetd",
    # The installer, on the media UKI.
    "lic/qsmcinstall",
    # The test hooks: in a test image only, never in a release.
    "lic/qsmchook",
    # The local console on the display and the serial port.
    "svc/console",
    # The web server, its users, its messages and its binary.
    "web/webd",
    "web/users",
    "web/msgs",
    "web/pages",
    "lic/qsmcwebd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# The two pins (docs/PHASE0.md). QS/VS's base crates at one commit of
# its main; QS/400's crates at exactly the commit that QS/VS commit
# pins, so the tree holds one copy of every shared crate. Moving either
# is its own commit, and they move together. Never path dependencies,
# never copies.
appliance = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
supervise = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
loadsource = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
state = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
logd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
netd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
seed = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
identity = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
stgd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
processor = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
users = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
panels = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
install = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
inventory = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
fdpass = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
# base/qemu, the harness's QEMU driver, named as QS/VS's harness names it.
driver = { package = "qemu", git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "2fe7583b8fc0eaeab92db7f31f34d152094f2727" }
buildkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
vrm = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
diskimg = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
abrec = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
ipc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
ntp = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
netlink = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
console = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525", default-features = false }
scrkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
svcusers = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
qsweb = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }
x509kit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "155aba213638b178cb730cff4a4113ef1d8fb525" }

anyhow = "1.0.104"
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.190"
rustix = { version = "1.1.6", features = ["fs", "mount", "event", "process", "system", "time", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.28.0"
# TLS for the web server, as QS/VS declares it, with TLS 1.2 besides.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The image's binaries: the userland check wants them static and
# stripped.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

# Argon2 unoptimized takes seconds per password hash (as QS/400 has it).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
