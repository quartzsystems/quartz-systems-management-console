[workspace]
resolver = "3"
# The fuzzer is a workspace of its own: QS/400's fuzzer brings crates
# the product never links (`tools/fuzz/Cargo.toml`).
exclude = ["tools/fuzz"]
members = [
    # Host tools: the build orchestrator, the conformance harness and the
    # simulated managed systems.
    "tools/build",
    "tools/conformance",
    "tools/sim",
    # Licensed Internal Code: PID 1, release identity, reference codes.
    "lic/qsmcinit",
    "lic/release",
    "lic/refcode",
    # Every service confined: its paths, ports and calls.
    "lic/sandbox",
    # The services: the base crates' own, run as QS/MC.
    "lic/qsmcstgd",
    "lic/qsmclogd",
    "lic/qsmcnetd",
    # The installer, on the media UKI.
    "lic/qsmcinstall",
    # The test hooks: in a test image only, never in a release.
    "lic/qsmchook",
    # The local console on the display and the serial port.
    "svc/console",
    # The web server, its users, its messages and its binary.
    "web/webd",
    "web/users",
    "web/msgs",
    "web/pages",
    "web/backup",
    "lic/qsmcwebd",
    # The managed-systems service: its sockets, the service and its binary.
    "mgmt/proto",
    "mgmt/mgmtd",
    "lic/qsmcmgmtd",
    # Scheduled operations: the service and its binary.
    "sched/schedd",
    "lic/qsmcschedd",
    # Serviceability: the console's problem log, its update, its streams.
    "lic/qsmcprobd",
    "lic/qsmcupdd",
    "upd/fetchd",
    "lic/qsmcfetchd",
    "lic/consdump",
    # System plans: the document, capture, validation, deployment's steps.
    "plan/model",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# The two pins (docs/PHASE0.md). QS/VS's base crates at one commit of
# its main; QS/400's crates at exactly the commit that QS/VS commit
# pins, so the tree holds one copy of every shared crate. Moving either
# is its own commit, and they move together. Never path dependencies,
# never copies.
appliance = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
supervise = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
loadsource = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
state = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
logd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
netd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
seed = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
identity = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
stgd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
processor = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
users = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
panels = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
install = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
inventory = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
fdpass = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
buildaid = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
update = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
problem = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
servicedump = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
stream = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
msg = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
confine = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
# base/qemu, the harness's QEMU driver, named as QS/VS's harness names it.
driver = { package = "qemu", git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "c65646262a73d7e9c07003c5ec65b4233feec1fc" }
buildkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
vrm = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
diskimg = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
abrec = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
ipc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
ntp = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
netlink = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
console = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7", default-features = false }
scrkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
svcusers = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
qsweb = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
x509kit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
qsi = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
qsisess = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
qsitrust = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
qsipart = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
termlook = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
srcdata = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
httpc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
updcat = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
# The shipped root authorities, which the download service checks an
# https:// update server by.
certs = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }
# Secure Boot signing of a release's UKIs, under base/buildaid.
pesign = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "de8e467f066f30acd38b00a753dac97374e767f7" }

anyhow = "1.0.104"
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.190"
rustix = { version = "1.1.6", features = ["fs", "mount", "event", "process", "system", "time", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.28.0"
# TLS for the web server, as QS/VS declares it, with TLS 1.2 besides.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
# A backup's encryption (`web/backup`): as QS/400 and QS/VS have them.
graviola = "0.4.1"
argon2 = "0.5.3"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The image's binaries: the userland check wants them static and
# stripped.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

# Argon2 unoptimized takes seconds per password hash (as QS/400 has it).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
