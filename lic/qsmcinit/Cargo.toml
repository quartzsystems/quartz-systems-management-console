[package]
name = "qsmcinit"
description = "QS/MC PID 1: the IPL in order, the service table, the control socket, the status screen, the slot and the orderly shutdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
release = { path = "../release", version = "0.1.0" }
refcode = { path = "../refcode", version = "0.1.0" }
appliance.workspace = true
processor.workspace = true
inventory.workspace = true
supervise.workspace = true
state.workspace = true
logd.workspace = true
seed.workspace = true
identity.workspace = true
loadsource.workspace = true
stgd.workspace = true
qmcbackup = { path = "../../web/backup", version = "0.1.0", default-features = false }
webusers = { path = "../../web/users", version = "0.1.0" }
abrec.workspace = true
diskimg.workspace = true
update.workspace = true
servicedump.workspace = true
consdump = { path = "../consdump", version = "0.1.0" }

# PID 1 is a Linux program; other hosts build a stub so the workspace checks.
[target.'cfg(target_os = "linux")'.dependencies]
fdpass.workspace = true
rustix.workspace = true

[dev-dependencies]
users.workspace = true

[lints]
workspace = true
