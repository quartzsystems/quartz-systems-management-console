# A workspace of its own: QS/400's fuzzer brings QS/400's parsers and
# its own `release` crate, which the product's tree must not hold. The
# pins are the main workspace's (`docs/PHASE3.md`).
[workspace]
resolver = "3"

[package]
name = "qsmcfuzz"
description = "QS/MC's fuzz targets over QS/400's fuzzer: a backup's reader, the certificate import, what the managed-systems service does with a peer's messages, a product stream's index, the console's update image"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[[bin]]
name = "qsmcfuzz"
path = "src/main.rs"

[dependencies]
# QS/400's fuzzer: its coverage counters, mutator and loop.
fuzz = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "960861dc3a948f6c9004f30b0f155732029d025c" }
qmcbackup = { path = "../../web/backup", version = "0.1.0" }
webd = { path = "../../web/webd", version = "0.1.0" }
mgmtd = { path = "../../mgmt/mgmtd", version = "0.1.0" }
fetchd = { path = "../../upd/fetchd", version = "0.1.0" }
qsmcupdd = { path = "../../lic/qsmcupdd", version = "0.1.0" }
plan = { path = "../../plan/model", version = "0.1.0" }
schedd = { path = "../../sched/schedd", version = "0.1.0" }
release = { path = "../../lic/release", version = "0.1.0" }
qsweb = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "960861dc3a948f6c9004f30b0f155732029d025c" }
termlook = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "960861dc3a948f6c9004f30b0f155732029d025c" }
qsi = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "960861dc3a948f6c9004f30b0f155732029d025c" }
state = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "dec674bd0b432da728a1dc00aa1adda1303d351b" }
seed = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "dec674bd0b432da728a1dc00aa1adda1303d351b" }
netd = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "dec674bd0b432da728a1dc00aa1adda1303d351b" }
update = { git = "https://github.com/quartzsystems/quartz-systems-virtual-server", rev = "dec674bd0b432da728a1dc00aa1adda1303d351b" }

# The fuzzer's build (`build fuzz`), as QS/400 has it.
[profile.fuzz]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 1
opt-level = 2
debug-assertions = true

[profile.dev.package.argon2]
opt-level = 3
